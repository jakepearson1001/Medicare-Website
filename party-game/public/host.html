<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odd Prompt Out — Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; gap: 16px; }
  header .logo { font-size: 2rem; }
  .code-box { text-align: right; }
  .code-box .code { font-size: 2.6rem; font-weight: 700; letter-spacing: 0.15em; color: var(--yellow); }
  main { flex: 1; padding: 0 32px 32px; display: flex; flex-direction: column; gap: 24px; }
  .center { text-align: center; }
  .big { font-size: clamp(2rem, 4.5vw, 3.6rem); font-weight: 700; }
  .sub { font-size: 1.4rem; opacity: 0.85; }
  .players { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .ptile { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); padding: 10px 18px 10px 10px; border-radius: 999px; font-size: 1.25rem; font-weight: 600; position: relative; }
  .ptile.off { opacity: 0.4; }
  .ptile .chk { margin-left: 4px; font-size: 1.3rem; }
  .ptile .kick { margin-left: 6px; background: none; border: 0; color: #fff; opacity: 0.4; cursor: pointer; font-size: 1rem; }
  .ptile .kick:hover { opacity: 1; }
  .join { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: stretch; }
  .join .card h2 { font-size: 1.8rem; margin-bottom: 12px; }
  .url { font-size: 1.6rem; font-weight: 700; color: var(--pink); word-break: break-all; }
  .codebig { font-size: 5rem; font-weight: 700; letter-spacing: 0.15em; line-height: 1; margin: 8px 0; }
  .steps { margin: 0; padding-left: 1.3em; font-size: 1.2rem; line-height: 1.6; }
  .timer { width: 84px; height: 84px; position: relative; flex: none; }
  .timer svg { transform: rotate(-90deg); }
  .timer span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.8rem; font-weight: 700; }
  .phasebar { display: flex; align-items: center; justify-content: center; gap: 24px; }
  .answers { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  .acard { position: relative; padding: 18px 18px 14px; transition: transform 0.4s, box-shadow 0.4s; }
  .acard .txt { font-size: 1.45rem; font-weight: 600; min-height: 2.6em; }
  .acard .who { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 600; color: var(--muted); }
  .acard .who .av { width: 30px; height: 30px; font-size: 0.9rem; }
  .acard .votes { position: absolute; top: -12px; right: -10px; background: var(--ink); color: var(--yellow); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 1.1rem; }
  .acard.odd { box-shadow: 0 0 0 6px var(--yellow), 0 10px 0 rgba(0,0,0,0.25); transform: scale(1.05) rotate(-1.5deg); }
  .acard.dim { opacity: 0.55; }
  .acard .badge { position: absolute; top: -14px; left: 14px; background: var(--yellow); color: var(--ink); font-weight: 700; padding: 2px 10px; border-radius: 8px; font-size: 0.95rem; }
  .reveal-banner { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .reveal-banner .card { text-align: center; }
  .reveal-banner .label { font-weight: 700; color: var(--muted); text-transform: uppercase; font-size: 0.9rem; letter-spacing: 0.08em; }
  .reveal-banner .prompt { font-size: 1.6rem; font-weight: 700; margin-top: 6px; }
  .verdict { font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 700; text-align: center; }
  .verdict.caught { color: var(--teal); }
  .verdict.escaped { color: var(--pink); }
  .board { display: flex; flex-direction: column; gap: 10px; max-width: 640px; margin: 0 auto; width: 100%; }
  .row { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.1); border-radius: 16px; padding: 10px 16px; font-size: 1.3rem; font-weight: 600; }
  .row .rank { width: 30px; opacity: 0.7; }
  .row .nm { flex: 1; }
  .row .delta { color: var(--teal); font-size: 1.1rem; }
  .row.first { background: var(--yellow); color: var(--ink); font-size: 1.6rem; }
  .row.first .av { box-shadow: 0 0 0 3px var(--ink); }
  .controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .hint { text-align: center; opacity: 0.7; }
  @media (max-width: 760px) {
    header { padding: 16px; }
    main { padding: 0 16px 24px; }
    .join, .reveal-banner { grid-template-columns: 1fr; }
    .codebig { font-size: 3.4rem; }
  }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="odd">ODD</span> PROMPT OUT</div>
  <div class="code-box" id="codebox"></div>
</header>
<main id="app"><div class="center big">Setting up room…</div></main>

<script>
const COLORS = ["#ffd23f","#2de2c4","#ff8a3d","#5b8cff","#ff4f9a","#a3e635","#c084fc","#f472b6","#38bdf8","#fb7185"];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
let S = null, session = null, endAt = 0, totalMs = 1, joinUrl = location.origin;

const colorOf = (pid) => { const i = S.players.findIndex((p) => p.id === pid); return COLORS[(i < 0 ? 0 : i) % COLORS.length]; };
const nameOf = (pid) => S.players.find((p) => p.id === pid)?.name ?? "?";
const av = (p) => `<span class="av" style="background:${colorOf(p.id)}">${esc(p.name[0]?.toUpperCase())}</span>`;

async function api(action, extra = {}) {
  const r = await fetch("/api", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, code: session?.code, hostToken: session?.hostToken, ...extra }) });
  return r.json();
}

async function init() {
  try { session = JSON.parse(sessionStorage.getItem("opo-host")); } catch {}
  if (session) {
    const ok = await api("check").catch(() => null);
    if (!ok?.ok) session = null;
  }
  if (!session) {
    const r = await api("create");
    session = { code: r.code, hostToken: r.hostToken, lanUrls: r.lanUrls };
    try { sessionStorage.setItem("opo-host", JSON.stringify(session)); } catch {}
  }
  const local = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
  if (local && session.lanUrls?.length) joinUrl = session.lanUrls[0];
  connect();
}

function connect() {
  const es = new EventSource(`/events?code=${session.code}&host=${session.hostToken}`);
  es.onmessage = (e) => {
    S = JSON.parse(e.data);
    if (S.timeLeft) { endAt = Date.now() + S.timeLeft;
      totalMs = { answer: 75000, vote: 60000, reveal: 25000 }[S.phase] || S.timeLeft; } else endAt = 0;
    render();
  };
  es.onerror = () => {
    if (es.readyState !== EventSource.CLOSED) return; // browser auto-retries
    setTimeout(() => location.reload(), 2000); // init() re-checks the room and recreates it if gone
  };
}

function timerHtml() {
  if (!endAt) return "";
  return `<div class="timer"><svg width="84" height="84"><circle cx="42" cy="42" r="36" stroke="rgba(255,255,255,.15)" stroke-width="8" fill="none"/>
    <circle id="tring" cx="42" cy="42" r="36" stroke="var(--yellow)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="226.2"/></svg><span id="tnum"></span></div>`;
}
function tick() {
  const n = $("#tnum"), ring = $("#tring");
  if (n && endAt) {
    const left = Math.max(0, endAt - Date.now());
    n.textContent = Math.ceil(left / 1000);
    ring.style.strokeDashoffset = 226.2 * (1 - left / totalMs);
    ring.style.stroke = left < 10000 ? "var(--pink)" : "var(--yellow)";
  }
  requestAnimationFrame(tick);
}

function scoreboard(deltas) {
  const sorted = [...S.players].sort((a, b) => b.score - a.score);
  return `<div class="board">${sorted.map((p, i) => `
    <div class="row ${i === 0 && p.score > 0 ? "first" : ""}"><span class="rank">${i + 1}</span>${av(p)}<span class="nm">${esc(p.name)}</span>
    ${deltas?.[p.id] ? `<span class="delta">+${deltas[p.id]}</span>` : ""}<span>${p.score}</span></div>`).join("")}</div>`;
}

function render() {
  $("#codebox").innerHTML = S.phase === "lobby" ? "" :
    `<div class="muted" style="color:#fff;opacity:.7">Round ${S.round} / ${S.totalRounds} · join code</div><div class="code">${S.code}</div>`;
  const app = $("#app");
  const P = S.players;

  if (S.phase === "lobby") {
    const enough = P.length >= S.minPlayers;
    app.innerHTML = `
      <div class="join">
        <div class="card pop">
          <h2>Grab your phone and go to</h2>
          <div class="url">${esc(joinUrl.replace(/^https?:\/\//, ""))}</div>
          <p class="muted" style="margin:14px 0 0">Room code</p>
          <div class="codebig">${S.code}</div>
        </div>
        <div class="card pop">
          <h2>How to play</h2>
          <ol class="steps">
            <li>Everyone gets a prompt on their phone and writes an answer.</li>
            <li>One player secretly got a <b>different</b> prompt — and has no idea.</li>
            <li>Read the answers, argue, then vote for who's the <b>Odd One Out</b>.</li>
            <li>Catch them: <b>+200</b>. If you're the Odd One: <b>+100</b> per player fooled, <b>+300</b> if you escape.</li>
          </ol>
        </div>
      </div>
      <div class="center sub">${P.length ? `${P.length} player${P.length > 1 ? "s" : ""} in` : "Waiting for players…"}
        ${enough ? "" : ` · need ${S.minPlayers - P.length} more`}</div>
      <div class="players">${P.map((p) => `<div class="ptile pop ${p.online ? "" : "off"}">${av(p)}${esc(p.name)}${p.id === S.vip ? " 👑" : ""}
        <button class="kick" title="Remove" data-kick="${p.id}">✕</button></div>`).join("")}</div>
      <div class="controls"><button class="btn" id="start" ${enough ? "" : "disabled"}>Everybody's in — start!</button></div>
      <div class="hint">The 👑 VIP can also start from their phone.</div>`;
    $("#start").onclick = () => api("start");
    app.querySelectorAll("[data-kick]").forEach((b) => (b.onclick = () => api("kick", { target: b.dataset.kick })));
    return;
  }

  if (S.phase === "answer") {
    const inR = P.filter((p) => p.inRound);
    const done = inR.filter((p) => p.answered).length;
    app.innerHTML = `
      <div class="phasebar">${timerHtml()}<div><div class="big">Check your phones!</div>
        <div class="sub">Answer your prompt. One of you got a different one… 🤫</div></div></div>
      <div class="center sub">${done} / ${inR.length} answered</div>
      <div class="players">${inR.map((p) => `<div class="ptile ${p.online ? "" : "off"}">${av(p)}${esc(p.name)}<span class="chk">${p.answered ? "✅" : "✏️"}</span></div>`).join("")}</div>
      <div class="controls"><button class="btn ghost" id="skip">Skip timer</button></div>`;
    $("#skip").onclick = () => api("skip");
    return;
  }

  if (S.phase === "vote") {
    const inR = P.filter((p) => p.inRound);
    app.innerHTML = `
      <div class="phasebar">${timerHtml()}<div><div class="sub">Most of you were asked:</div>
        <div class="big">“${esc(S.realPrompt)}”</div></div></div>
      <div class="answers">${S.answers.map((a, i) => `
        <div class="card acard pop" style="animation-delay:${i * 80}ms">
          <div class="txt">${a.text ? esc(a.text) : '<span class="muted">(no answer…suspicious)</span>'}</div>
          <div class="who">${av({ id: a.id, name: a.name })}${esc(a.name)}</div></div>`).join("")}</div>
      <div class="center sub">Who got the odd prompt? Discuss, then vote on your phone!</div>
      <div class="players">${inR.map((p) => `<div class="ptile">${av(p)}${esc(p.name)}<span class="chk">${p.voted ? "🗳️" : "🤔"}</span></div>`).join("")}</div>
      <div class="controls"><button class="btn ghost" id="skip">Reveal now</button></div>`;
    $("#skip").onclick = () => api("skip");
    return;
  }

  if (S.phase === "reveal") {
    const R = S.result;
    app.innerHTML = `
      <div class="verdict pop ${R.caught ? "caught" : "escaped"}">${R.caught
        ? `🚨 Caught! It was ${esc(R.oddName)}!`
        : `😈 ${esc(R.oddName)} slipped away!`}</div>
      <div class="reveal-banner">
        <div class="card pop"><div class="label">Everyone else got</div><div class="prompt">“${esc(R.realPrompt)}”</div></div>
        <div class="card pop" style="background:var(--yellow)"><div class="label" style="color:var(--ink)">${esc(R.oddName)} got</div><div class="prompt">“${esc(R.oddPrompt)}”</div></div>
      </div>
      <div class="answers">${S.answers.map((a) => {
        const odd = a.id === R.oddId, n = R.tally[a.id] || 0;
        const voters = R.votes.filter((v) => v.to === a.id).map((v) => nameOf(v.from));
        return `<div class="card acard ${odd ? "odd" : "dim"}">
          ${odd ? '<span class="badge">ODD ONE OUT</span>' : ""}${n ? `<span class="votes">${n} 🗳️</span>` : ""}
          <div class="txt">${a.text ? esc(a.text) : '<span class="muted">(no answer)</span>'}</div>
          <div class="who">${av({ id: a.id, name: a.name })}${esc(a.name)}</div>
          ${voters.length ? `<div class="muted" style="font-size:.9rem;margin-top:6px">Voted by: ${voters.map(esc).join(", ")}</div>` : ""}
        </div>`; }).join("")}</div>
      <div class="phasebar">${timerHtml()}<div class="sub">${S.round >= S.totalRounds ? "Final scores coming up…" : "Next round soon…"}</div></div>
      ${scoreboard(R.deltas)}
      <div class="controls"><button class="btn alt" id="skip">${S.round >= S.totalRounds ? "Final results" : "Next round"} →</button></div>`;
    $("#skip").onclick = () => api("skip");
    return;
  }

  if (S.phase === "final") {
    const top = [...P].sort((a, b) => b.score - a.score)[0];
    app.innerHTML = `
      <div class="center"><div class="sub">And the most perceptive (or sneakiest) player is…</div>
        <div class="big wobble" style="color:var(--yellow);margin:12px 0">🏆 ${esc(top?.name ?? "Nobody")} 🏆</div></div>
      ${scoreboard()}
      <div class="controls"><button class="btn" id="again">Play again</button>
        <button class="btn ghost" id="newroom">New room</button></div>`;
    $("#again").onclick = () => api("again");
    $("#newroom").onclick = () => { sessionStorage.removeItem("opo-host"); location.reload(); };
  }
}

requestAnimationFrame(tick);
init();
</script>
</body>
</html>
